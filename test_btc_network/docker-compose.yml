services:
  bitcoind:
    image: lncm/bitcoind:v27.0
    container_name: btc-regtest
    restart: unless-stopped
    ports:
      - "18443:18443"  # RPC port for regtest
      - "18444:18444"  # P2P port for regtest
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    command:
      - -printtoconsole
      - -regtest=1
      - -rpcuser=bitcoin
      - -rpcpassword=bitcoin123
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001

volumes:
  bitcoin_data:
